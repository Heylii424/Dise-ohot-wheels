<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Virtual de Hot Wheels Interactivo</title>
    <!-- Enlace al archivo de estilos externos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

        <!-- PANTALLA 1: CARRUSEL INICIAL -->
    <div class="carousel-wrapper" id="envelopeWrapper">
        <div class="carousel-container">
            <!-- NOTA: Reemplaza estas URLs de prueba por tus fotos favoritas de fondo o de ustedes -->
            <div class="carousel-slide active">
                <img class="img-fluid" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSR66feN38JuoRBCogIidTn_zJeDkNJ28MfLxwQlkTNNOZCUlt9r8cvv4o&s=10" alt="..." />
            </div>
            <div class="carousel-slide">
                <img class="img-fluid" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3a7u1XOOisGKqAJ70VvA27-gVfVPCJOT6wqT-7I4cs-c6VoDrtcoPHbc&s=10" alt="Foto2">
            </div>
            <div class="carousel-slide">
                <img class="img-fluid" src="https://www.clarin.com/2024/01/02/wFBeiC5x-_2000x1500__1.jpg" alt="Foto3">
            </div>

            <!-- Botones de navegación del carrusel -->
            <button class="prev-btn" onclick="moveSlide(-1)">&#10094;</button>
            <button class="next-btn" onclick="moveSlide(1)">&#10095;</button>
        </div>

        <div class="envelope-text">Tienes un detalle pendiente...</div>
        <button class="open-bouquet-btn" onclick="openBouquet()">¡Abrir Detalle! 🎁</button>
    </div>


    <!-- PANTALLA 2: EL RAMO CON ANIMACIONES -->
    <div class="bouquet-container" id="bouquetContainer">
        <h1 class="title">Hoy es 30 de septiembre…</h1>
        <h3 class="title"> y no podía dejar pasar este día sin decirte algo.  </h3>
        
        <div class="bouquet">
            <!-- NOTA: Reemplaza estos enlaces por las fotos PNG transparentes de tus Hot Wheels -->
            <img src="https://www.zoladi.com/cdn/shop/files/27AC12FF-F3DE-464C-AC29-3B56927A7D60.png?v=1769973556&width=1946" class="car car-1" alt="Carro 1" onclick="showMsg(1)">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRh75UTyfvxUN0G3M9PK9UP2Y5DC93kdt88XbLHAj-HKPcFFFOECs7ruhE&s=10" class="car car-2" alt="Carro 2" onclick="showMsg(2)">
            <img src="https://http2.mlstatic.com/D_NQ_NP_879982-MLU69839445368_062023-O.webp" class="car car-3" alt="Carro 3" onclick="showMsg(3)">
            <img src="https://i.etsystatic.com/25240650/r/il/84df76/6265177310/il_570xN.6265177310_r79k.jpg" class="car car-4" alt="Carro 4" onclick="showMsg(4)">
            <img src="https://i.pinimg.com/736x/b2/c6/20/b2c620fe5676be3b17a92e5c376c86d6.jpg" class="car car-5" alt="Carro 5" onclick="showMsg(5)">
        
            <div class="bouquet-paper"></div>
           <img src="https://thumbs.dreamstime.com/b/foto-de-larga-exposici%C3%B3n-un-auto-taxi-amarillo-conduciendo-en-el-centro-manhattan-nueva-york-una-toma-perfecto-como-fondo-259676053.jpg" alt="Foto" width="470" height="420">
        </div>
        <h2 class="subtitle">Nunca dejes de ser túiiii</h2>
        <!-- NUEVO BOTÓN DE REGRESO -->
        <!-- Cambiamos closeMsg() por resetEverything() -->
        <button class="back-btn" onclick="resetEverything()">sos Inefable :)</button>
    </div>
        <!-- PANTALLA 3: VENTANA DE MENSAJES (MODAL) -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeMsg()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeMsg()">&times;</span>
            <img src="" id="modalImg" class="modal-img" alt="Carro Ampliado">
            <p id="modalText" class="modal-text">Mensaje personalizado...</p>
        </div>
    </div>

    <!-- Enlace al archivo de lógica interactiva -->
    <script src="script.js"></script>
    
</body>
</html>
